<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Manage your tenancy, lease, invoices, payments and documents securely.">
  <meta name="theme-color" content="#0D211D">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Tenant Portal">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg"/>
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Tenant Portal</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      background: #0D211D;
      height: 100%;
      margin: 0;
    }
    #app-loading {
      align-items: center;
      display: flex;
      height: 100%;
      justify-content: center;
    }
    #app-loading svg {
      height: 120px;
      width: 120px;
    }
  </style>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <div id="app-loading" role="status" aria-label="Opening Tenant Portal">
    <svg viewBox="0 0 512 512" aria-hidden="true">
      <path fill="#FAF8F3" d="M112 400V222C112 129 176 72 256 72s144 57 144 150v178h-74V224c0-46-29-76-70-76s-70 30-70 76v176h-74Z"/>
      <path fill="#D6B477" d="m232 104 48 0-11 49c-9-4-17-4-26 0l-11-49Z"/>
      <path fill="#D6B477" d="m216 246 47 9c21 4 33 19 33 39v76l-80 28V246Z"/>
      <rect x="164" y="384" width="184" height="24" rx="12" fill="#159775"/>
    </svg>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      document.getElementById('app-loading')?.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
